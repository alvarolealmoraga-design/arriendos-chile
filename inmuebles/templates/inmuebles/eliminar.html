{% extends "base.html" %}
{% block titulo %}Eliminar inmueble{% endblock %}
{% block contenido %}
<div class="tarjeta angosta">
  <h1>Eliminar inmueble</h1>
  <p>¿Seguro que quieres eliminar <strong>{{ inmueble.nombre }}</strong> ({{ inmueble.comuna.nombre }})?</p>
  <p>Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button class="boton peligro" type="submit">Sí, eliminar</button>
    <a class="boton secundario" href="{% url 'mis_inmuebles' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
